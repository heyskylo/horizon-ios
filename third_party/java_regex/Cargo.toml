[package]
name = "java_regex"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["Mathieu Dutour Sikiric <mathieu.dutour@gmail.com>"]
repository = "https://github.com/MathieuDutSik/java_regex"
description = "Vendored Java regular-expression engine with Horizon compatibility fixes"

[workspace]

[features]
default = []
fuzz-gen = ["dep:arbitrary"]
stack-growth = ["dep:stacker"]

[dependencies]
stacker = { version = "0.1", optional = true }
arbitrary = { version = "1", features = ["derive"], optional = true }
unicode-general-category = { version = "=1.1.0", default-features = false }
unicode-script = { version = "=0.5.7", default-features = false }

unicode-segmentation = { version = "=1.12.0", default-features = false }

[dev-dependencies]
serde_json = "1"
