name: LauncherPreview
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
targets:
  LauncherPreview:
    type: application
    platform: iOS
    sources:
      - path: PreviewApp.swift
      - path: ../PreviewSupport
      - path: ../Launcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.native-launcher-preview
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  LauncherOrientationFixture:
    type: application
    platform: iOS
    sources:
      - path: PreviewApp.swift
      - path: ../PreviewSupport
      - path: ../Launcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.launcher-orientation-fixture
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ORIENTATION_FIXTURE"
  LauncherOrientationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OrientationUITests.swift
    dependencies:
      - target: LauncherOrientationFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.launcher-orientation-fixture.tests
  LauncherPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests.swift
    dependencies:
      - target: LauncherPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.native-launcher-preview.tests
  LauncherLogicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormattingTests.swift
    dependencies:
      - target: LauncherPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.native-launcher-preview.logic-tests
schemes:
  LauncherPreview:
    build:
      targets:
        LauncherPreview: all
        LauncherPreviewUITests: [test]
        LauncherLogicTests: [test]
    test:
      targets:
        - LauncherPreviewUITests
        - LauncherLogicTests

  LauncherOrientationFixture:
    build:
      targets:
        LauncherOrientationFixture: all
        LauncherOrientationUITests: [test]
    test:
      targets:
        - LauncherOrientationUITests
