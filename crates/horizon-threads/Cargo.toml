[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scheduling hints for the game's threads and its allocator, and the other OS calls the crates that forbid unsafe code can't make"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
framehop = { version = "0.16", default-features = false, features = ["std"] }
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }
addr2line = { version = "0.26", default-features = false, features = ["std"] }
memmap2 = "0.9"
rustc-demangle = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Set by horizon-client's `system-allocator`, which leaves nothing to count.
system-allocator = []
# Counts each thread's allocations and frees (`alloc_count`); the game allocator counts them.
alloc-count = []
# Counts live heap bytes by startup step and thread (`CensusAllocator`); for measuring only.
alloc-census = ["alloc-count"]

[lints]
workspace = true
