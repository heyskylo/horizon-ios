[package]
name = "horizon-dualsense"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The DualSense's output over HID: rumble, adaptive triggers, lightbar and player LEDs"

[dependencies]
log = "0.4"

# hidapi has no iOS backend and its build script stops there, so the output's two
# dependencies go only to the targets that have one. On iOS the crate builds without
# output: the Link never opens.
[target.'cfg(not(target_os = "ios"))'.dependencies]
# MIT; bundles the C hidapi under its BSD licence option. hidraw on Linux (libudev, as gilrs),
# IOKit on macOS (opened shared, so gilrs keeps reading the pad), the HID API on Windows.
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw", "macos-shared-device"] }
# HD haptics through the pad's own audio device (USB).
cpal = "0.16"

[lints]
workspace = true
