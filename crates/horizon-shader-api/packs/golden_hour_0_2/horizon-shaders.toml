schema = 1
id = "golden_hour_0_2"
name = "Golden Hour (shader API 0.2)"
version = "1.0.0"
api = "0.2"
description = "Golden Hour written for shader API 0.2, in linear light. A test pack of the SDK, not offered to players."
authors = ["Horizon"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Warm horizon"

[[post]]
file = "post/glow.wgsl"
name = "Glow"

[[post]]
file = "post/grade.wgsl"
name = "Colour grade"

[[options]]
id = "sun_glow"
name = "Sunset glow"
description = "How warm the sky is around a low sun."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "glow"
name = "Glow"
description = "The soft halo around bright things: the sun, lava, torches."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "warmth"
name = "Warmth"
description = "How golden the light turns when the sun is low."
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.1
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
type = "bool"
default = true

[budget]
gpu_ms = 1.0
