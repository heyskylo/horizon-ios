[package]
name = "horizon-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Opt-in data collection: the player's consent, the payloads, the local outbox and its upload"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# zstd in pure Rust: batches are compressed before they leave and checked when they arrive.
ruzstd = "0.9"
# The random install ID and outbox file names.
getrandom = "0.3"
# Sending, for the launcher (and the game's "I'm playing" ping); the ingest server builds without it.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[features]
default = ["upload", "live"]
upload = ["dep:ureq"]
# The "I'm playing" ping and reading the live count (`live`), for the game and the launcher.
live = ["dep:ureq"]

[[test]]
name = "consent_gating"
required-features = ["upload"]

[lints]
workspace = true
