name: fork claim
# `/claim` and `/unclaim` on this fork, and a daily release of stale claims (tools/fork/claim.py); never runs a pull request's code.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  command:
    if: >-
      github.repository == 'sunrise-org/horizon' && github.event_name == 'issue_comment' &&
      github.event.comment.user.type != 'Bot' && (
      startsWith(github.event.comment.body, '/claim') ||
      startsWith(github.event.comment.body, '/unclaim') ||
      startsWith(github.event.comment.body, '🤖 Agent: /claim') ||
      startsWith(github.event.comment.body, '🤖 Agent: /unclaim'))
    concurrency:
      group: claim-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/fork-reviewers.txt
            tools/ci/nightly_set.py
            tools/ci/claim_command.py
            tools/fork/claim.py
          sparse-checkout-cone-mode: false
      - name: Run the command
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ID: ${{ github.event.comment.user.id }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
          FORK_OWNER: ${{ vars.FORK_OWNER }}
          FORK_OWNER_ID: ${{ vars.FORK_OWNER_ID }}
        run: python3 tools/fork/claim.py command
  release:
    if: github.repository == 'sunrise-org/horizon' && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/fork-reviewers.txt
            tools/ci/nightly_set.py
            tools/ci/claim_command.py
            tools/fork/claim.py
          sparse-checkout-cone-mode: false
      - name: Release stale claims
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORK_OWNER: ${{ vars.FORK_OWNER }}
          FORK_OWNER_ID: ${{ vars.FORK_OWNER_ID }}
        run: python3 tools/fork/claim.py release
