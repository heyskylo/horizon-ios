name: perf-web
# The web UI of the performance platform (docs/perf-platform.md §7.1): the wasm build of
# `horizon-perf`, the agreement test that it answers like the CLI, and the Next.js app in `web/perf/`.
# The build's artifact is the standalone server bundle the team deploys to horizon-perf.umceko.com;
# nothing here publishes a release.
on:
  push:
    branches: [perf-platform, main]
    paths:
      - 'crates/horizon-perf/**'
      - 'crates/horizon-perf-format/**'
      - 'crates/horizon-bench/**'
      - 'web/perf/**'
      - '.github/workflows/perf-web.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'crates/horizon-perf/**'
      - 'crates/horizon-perf-format/**'
      - 'crates/horizon-bench/**'
      - 'web/perf/**'
      - '.github/workflows/perf-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-web-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-web
      # The agreement test: the C ABI, called natively, must print the bytes the CLI prints.
      - name: The wasm ABI agrees with the CLI
        run: cargo test -p horizon-perf --features wasm --test wasm
      - name: Build the wasm the page loads
        run: cargo run -p xtask -- perf-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/perf/package-lock.json
      - name: Install the app
        run: npm ci
        working-directory: web/perf
      - name: Test the app
        run: npm test
        working-directory: web/perf
      - name: Build the app
        run: npm run build
        working-directory: web/perf
      # `output: standalone` writes the server bundle; the static assets are separate files it expects.
      - name: Assemble the deployable bundle
        run: |
          cp -r web/perf/public web/perf/.next/standalone/
          cp -r web/perf/.next/static web/perf/.next/standalone/.next/
      - uses: actions/upload-artifact@v4
        with:
          name: perf-web
          path: web/perf/.next/standalone
          if-no-files-found: error
