name: fork review batch
# Keeps the `review-batch` issue current and signals a due batch (tools/fork/review_batch.py); reads the API only, never a pull request's code.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: [checks]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-review-batch
jobs:
  update:
    if: github.repository == 'sunrise-org/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/fork/review_batch.py
          sparse-checkout-cone-mode: false
      - name: Update the batch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          FORK_OWNER: ${{ vars.FORK_OWNER }}
        run: python3 tools/fork/review_batch.py update
